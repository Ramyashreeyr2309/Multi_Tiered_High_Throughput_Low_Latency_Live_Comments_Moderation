<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reset password · Live Stream App</title>
  <script src="/media/site-header.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      color: #202124;
      background: #f7f8f8;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input { font: inherit; }
    main { display: grid; min-height: calc(100vh - 64px); place-items: center; padding: 36px 20px; }
    .reset-card { width: min(100%, 440px); padding: 34px; background: #fff; border: 1px solid #e1e4e6; border-radius: 8px; }
    .reset-card h2 { margin: 0 0 8px; font-size: 25px; }
    .intro { margin: 0 0 26px; color: #687078; font-size: 14px; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
    input { display: block; width: 100%; min-height: 44px; padding: 10px 12px; color: #202124; background: #fff; border: 1px solid #cbd0d4; border-radius: 5px; outline: none; }
    input:focus { border-color: #2876d2; box-shadow: 0 0 0 2px #2876d222; }
    button { width: 100%; min-height: 44px; padding: 10px 16px; color: #fff; background: #1769c2; border: 0; border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: #0e58a7; }
    button:disabled { opacity: .65; cursor: wait; }
    .secondary-button { color: #1769c2; background: #edf4ff; border: 1px solid #cfe0ff; }
    .secondary-button:hover:not(:disabled) { background: #e2edff; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .button-row button { flex: 1 1 180px; }
    #form-status { min-height: 20px; margin: 14px 0 0; color: #687078; font-size: 13px; line-height: 1.5; }
    #form-status[data-state="error"] { color: #9c3027; }
    #form-status[data-state="success"] { color: #216e39; }
    .back-link { margin-top: 20px; text-align: center; }
    .back-link a { color: #1769c2; font-weight: 600; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    @media (max-width: 520px) {
      main { min-height: calc(100vh - 56px); padding: 22px 14px; }
      .reset-card { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="reset-card" aria-labelledby="reset-heading">
      <h2 id="reset-heading">Reset your password</h2>
      <p class="intro">Enter your email to receive a one-time code, then create a new password.</p>

      <form id="reset-password-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="mail_id" type="email" autocomplete="username" required>
        </div>

        <div class="button-row">
          <button class="secondary-button" id="send-otp-button" type="button">Send code</button>
        </div>

        <div class="field">
          <label for="otp">One-time code</label>
          <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the 6-digit code">
        </div>

        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" name="new_password" type="password" autocomplete="new-password" placeholder="Choose a new password">
        </div>

        <button id="submit-button" type="submit">Reset password</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="back-link"><a href="/login">Back to sign in</a></p>
    </section>
  </main>

  <script>
    const resetPasswordForm = document.querySelector("#reset-password-form");
    const sendOtpButton = document.querySelector("#send-otp-button");
    const submitButton = document.querySelector("#submit-button");
    const formStatus = document.querySelector("#form-status");

    function showStatus(message, state) {
      formStatus.textContent = message;
      formStatus.dataset.state = state;
    }

    sendOtpButton.addEventListener("click", async () => {
      const email = document.querySelector("#email").value.trim();
      if (!email) {
        showStatus("Enter your email address first.", "error");
        return;
      }

      sendOtpButton.disabled = true;
      showStatus("Sending reset code...", "loading");

      try {
        const response = await fetch(`/api/v1/user_service/user/reset_password?mail_id=${encodeURIComponent(email)}`);
        const result = await response.json();
        if (!response.ok) {
          throw new Error(typeof result.detail === "string" ? result.detail : "Could not send the reset code.");
        }
        showStatus("A reset code has been sent to your email.", "success");
      } catch (error) {
        showStatus(error.message || "Unable to send reset code.", "error");
      } finally {
        sendOtpButton.disabled = false;
      }
    });

    resetPasswordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.querySelector("#email").value.trim();
      const otp = document.querySelector("#otp").value.trim();
      const newPassword = document.querySelector("#new-password").value;

      if (!email || !otp || !newPassword) {
        showStatus("Email, reset code, and new password are required.", "error");
        return;
      }

      submitButton.disabled = true;
      showStatus("Resetting your password...", "loading");

      try {
        const response = await fetch("/api/v1/user_service/user/reset_password/", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mail_id: email,
            otp,
            new_password: newPassword
          })
        });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(typeof result.detail === "string" ? result.detail : "Password reset failed.");
        }

        showStatus("Password reset successfully. You can now sign in.", "success");
        resetPasswordForm.reset();
        setTimeout(() => {
          window.location.assign("/login");
        }, 1200);
      } catch (error) {
        showStatus(error.message || "Unable to reset password.", "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
