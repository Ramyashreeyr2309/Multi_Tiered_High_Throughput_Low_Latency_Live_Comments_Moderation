name: Deploy Microservices to AWS ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - all
          - apigateway-service
          - user-service
          - live-event-service
          - tier-1-service
          - tier-2-service
          - monitoring-service
        default: all

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. API Gateway
          - service-name: apigateway-service
            ecr-repo: microservices/apigateway-service
            context-path: Apigateway_service

          # 2. User Service
          - service-name: user-service
            ecr-repo: microservices/user-service
            context-path: User_Service

          # 3. Live Event Service
          - service-name: live-event-service
            ecr-repo: microservices/live-event-service
            context-path: Live_Event_Service

          # 4. Tier 1 Moderation Service (ONNX)
          - service-name: tier-1-service
            ecr-repo: microservices/tier-1-service
            context-path: Tier_1_Service

          # 5. Tier 2 Moderation Service (LLM)
          - service-name: tier-2-service
            ecr-repo: microservices/tier-2-service
            context-path: Tier_2_Service

          # 6. Monitoring Service
          - service-name: monitoring-service
            ecr-repo: microservices/monitoring
            context-path: Montoring_service

    steps:
      - name: Checkout Repository Code
        if: ${{ inputs.service == 'all' || matrix.service-name == inputs.service }}
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ inputs.service == 'all' || matrix.service-name == inputs.service }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        if: ${{ inputs.service == 'all' || matrix.service-name == inputs.service }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        if: ${{ inputs.service == 'all' || matrix.service-name == inputs.service }}
        working-directory: Microservices
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ matrix.context-path }}/dockerfile -t $ECR_REGISTRY/${{ matrix.ecr-repo }}:$IMAGE_TAG -t $ECR_REGISTRY/${{ matrix.ecr-repo }}:latest .
          docker push $ECR_REGISTRY/${{ matrix.ecr-repo }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.ecr-repo }}:latest

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster comment-moderation-app \
            --service ${{ matrix.service-name }} \
            --force-new-deployment
